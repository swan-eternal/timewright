<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Timewright</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <nav id="breadcrumb" aria-label="Map"></nav>
        <form id="date-form">
          <label class="visually-hidden" for="date-input">Date</label>
          <input id="date-input" type="text" autocomplete="off" spellcheck="false" placeholder="1815-06-18" />
          <button type="submit">Go</button>
        </form>
      </header>
      <div id="stepbar">
        <button id="prev-step" type="button" aria-label="Previous step">‹</button>
        <span id="step-label"></span>
        <button id="next-step" type="button" aria-label="Next step">›</button>
        <select id="trace-select" aria-label="Trace someone"></select>
        <input id="search" type="search" placeholder="Search" aria-label="Search" />
      </div>
      <main id="map" aria-label="Map"></main>
      <div id="timeline">
        <div id="context" aria-label="The whole range of the world"></div>
        <div id="strip" aria-label="Timeline"></div>
      </div>
      <aside id="card" hidden aria-live="polite"></aside>
      <div id="results" hidden></div>
      <p id="status" role="status"></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
