<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timewright — your worlds</title>
    <style>
      :root { --bg: #f7f4ee; --panel: #fffdf8; --ink: #2b2620; --muted: #6b6155; --line: #ddd4c4; --accent: #1f4fa0; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
      header { padding: 0.9rem 1.2rem 0.2rem; }
      header h1 { font-size: 1.15rem; margin: 0 0 0.2rem; }
      header p { margin: 0; color: var(--muted); font-size: 0.85rem; }
      main { padding: 0 1.2rem 2rem; max-width: 46rem; margin: 0 auto; }
      section { margin-top: 1.4rem; }
      h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 0.6rem; }
      #new-card { display: flex; gap: 0.5rem; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0.8rem; }
      #new-card input { flex: 1; min-width: 0; padding: 0.5rem 0.6rem; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; }
      button { padding: 0.5rem 0.9rem; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.7rem; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0.8rem 0.9rem; display: flex; flex-direction: column; gap: 0.35rem; }
      .card h3 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
      .card .meta { color: var(--muted); font-size: 0.82rem; }
      .card .row { margin-top: 0.25rem; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
      .card .row a { font-size: 0.82rem; color: var(--accent); }
      .card.broken { border-color: #c0703a; }
      #banner:empty { display: none; }
      #banner { background: #f6e3d3; border: 1px solid #c0703a; color: #6f3a1a; border-radius: 6px; padding: 0.5rem 0.7rem; margin-top: 0.8rem; font-size: 0.88rem; }
      p.empty { color: var(--muted); }
      @media (max-width: 600px) { #new-card { flex-direction: column; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Timewright</h1>
      <p>Create a world, then edit it right here in your browser. Keep the Timewright window open while you work.</p>
    </header>
    <main>
      <section>
        <h2>New world</h2>
        <form id="new-card">
          <input id="name" placeholder="Name your world" maxlength="64" autocomplete="off" aria-label="World name" />
          <button id="create" type="submit">Create world</button>
        </form>
        <div id="banner"></div>
      </section>
      <section>
        <h2>Your worlds</h2>
        <div id="grid"></div>
        <p class="empty" id="empty" hidden>No worlds yet — create your first one above.</p>
      </section>
    </main>
    <script>
      const grid = document.getElementById("grid");
      const banner = document.getElementById("banner");
      const form = document.getElementById("new-card");
      const nameInput = document.getElementById("name");
      const create = document.getElementById("create");
      const empty = document.getElementById("empty");

      async function post(apiPath, body) {
        const response = await fetch(apiPath, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || "Request failed (" + response.status + ")");
        }
        return data;
      }

      function card(world) {
        const node = document.createElement("div");
        node.className = world.error ? "card broken" : "card";
        const title = document.createElement("h3");
        title.textContent = world.title || world.folder;
        node.appendChild(title);
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = world.error
          ? "This world has a problem: " + world.error + " (" + world.folder + ")"
          : world.events + " events · " + world.people + " people · " + world.locations + " places";
        node.appendChild(meta);
        const row = document.createElement("div");
        row.className = "row";
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "Edit";
        edit.addEventListener("click", () => openEditor(world.folder, edit, row));
        row.appendChild(edit);
        node.appendChild(row);
        return node;
      }

      async function openEditor(folder, button, row) {
        button.disabled = true;
        button.textContent = "Opening…";
        banner.replaceChildren();
        try {
          const data = await post("/api/edit", { folder });
          window.location.href = data.url;
          const link = document.createElement("a");
          link.href = data.url;
          link.textContent = "If nothing opens, click here";
          row.appendChild(link);
        } catch (error) {
          button.disabled = false;
          button.textContent = "Edit";
          banner.textContent = String(error.message || error);
        }
      }

      async function load() {
        const response = await fetch("/api/worlds");
        if (!response.ok) {
          throw new Error("Could not list worlds (" + response.status + ")");
        }
        const data = await response.json();
        grid.replaceChildren();
        empty.hidden = data.worlds.length > 0;
        for (const world of data.worlds) {
          grid.appendChild(card(world));
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        banner.replaceChildren();
        create.disabled = true;
        try {
          await post("/api/worlds", { name: nameInput.value });
          nameInput.value = "";
          await load();
        } catch (error) {
          banner.textContent = String(error.message || error);
        } finally {
          create.disabled = false;
        }
      });

      load().catch((error) => {
        banner.textContent = String(error.message || error);
      });
    </script>
  </body>
</html>
