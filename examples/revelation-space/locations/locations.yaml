- id: santiago
  name: Santiago
  kind: mobile
  tags:
    - vessel
    - generation ship
  stays:
    - at: Deep space
      from: 2083
      until: 2300
    - at: Sky's Edge
      from: 2300
  card: "One of the five Flotilla ships — with Palestine, Brasilia, Islamabad and Baghdad — that left
    Mercury in 2083 for the 61 Cygni A system: humanity's first manned interstellar colonisation
    effort. Each was a two-kilometre re-purposed in-system freighter carrying 960 passengers in
    reefersleep caskets and a crew of 150, driven by a lithium/antilithium reaction with separate
    antimatter reservoirs for acceleration and deceleration. The destination planet was named
    Journey's End and renamed Sky's Edge by the colonists. Only three of the five reached it, undone
    by external sabotage and internal scheming; the Santiago was one of them, and Schuyler 'Sky'
    Haussmann sailed aboard her. DATES ARE APPROXIMATE: 2083 is the official departure, but the
    official timeline says only that the Flotilla would not arrive before the twenty-third century,
    so 2300 stands for the LATEST possible arrival rather than a documented one. The ship's own fate
    after arrival is not modelled."
  sources:
    - wiki:Flotilla
    - official-timeline
