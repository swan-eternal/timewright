- id: sky-haussmann
  name: Sky Haussmann
  tags:
    - character
  aliases:
    - Tanner Mirabel
  stays:
    - at: Sky's Edge
      from: 2300
      until: 2517
    - at: Chasm City
      from: 2517
  bio: "Schuyler 'Sky' Haussmann — a 'momio', a sleeper awakened from reefersleep, who sailed on the
    Santiago. He jettisoned reefersleep caskets so the Santiago would arrive first at Journey's End,
    and the colonists renamed the planet 'Sky's Edge' as a mockery. Crucified through a stand-in, he
    slept a century in reefersleep, and became the centre of the Church of Sky cult and its
    indoctrination virus. He re-emerged as the arms dealer Cahuella, then as 'Tanner Mirabel', then
    as 'H' — the man who killed and replaced the Mademoiselle, and who drew Nevil Clavain into the
    Resurgam evacuation. Immortal; his death date is not established. DATES ARE APPROXIMATE: the
    official timeline fixes the Flotilla's 2083 departure and says it would not arrive before the
    twenty-third century, so 2300 stands in for the latest possible arrival at Sky's Edge; 2517 is
    the year Tanner Mirabel reaches Chasm City, by which point the Mirabel/Reivich sequence has
    played out. He was certainly in Chasm City by 2524, when he recruited Ana Khouri into
    Shadowplay. The Flotilla years (2083-2300) are not modelled — there is no node for the
    Santiago."
  sources:
    - wiki:Sky_Haussmann
    - official-timeline
    - chasm-city
    - redemption-ark
