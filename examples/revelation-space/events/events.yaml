  order: 150
  card: "The Inhibitors are a galaxy-scale threat: a post-intelligent machine race left over from the
    Dawn War, whose stated purpose was to inhibit the spread of intelligent life beyond individual
    planets or solar systems ahead of the Andromeda–Milky Way collision. Called wolves by the
    Conjoiners because they lurked in the blackness of interstellar space and attacked in packs."
