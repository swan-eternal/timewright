- name: Joséphine de Beauharnais
  id: josephine
  aliases: [Josephine, Rose, Empress Joséphine]
  born: 1763-06-23
  died: 1814-05-29
  color: "#c24d7c"
  tags: [france, empress]
  bio: |
    Born Rose Tascher de La Pagerie on a Martinique sugar plantation, widowed
    by the guillotine, and Empress of the French by a marriage in 1796 that
    Napoleon's family never accepted. Divorced for want of an heir, she
    retired to Malmaison and its roses, and died a month after his first
    fall.
